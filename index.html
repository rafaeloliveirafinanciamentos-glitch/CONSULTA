<style>
  :root{
    --brand-red: #C00000;
    --brand-dark: #8B0000;
    --bg-color: #F4F6F8;
    --card: #FFFFFF;
    --text-main: #1A1A1A;
    --text-muted: #666666;
    --line: #E2E8F0;
    --ok: #059669;
    --warn: #D97706;
    --err: #DC2626;
    --step-done: #C00000;
    --step-current: #C00000;
    --step-pending: #CBD5E1;
    --step-refused: #DC2626;
    --cost-bg: #FFFBEB;
    --cost-border: #FDE68A;
    --cost-text: #92400E;
    --cost-value: #B45309;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:32px 16px 60px;
    color: var(--text-main);
  }
  .wrap{width:100%;max-width:760px;}

  header {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 5px solid var(--brand-red);
  }
  .logo-box {
    width: 56px; height: 56px;
    background-color: var(--brand-red);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 900; font-size: 2rem;
    font-family: Arial, sans-serif;
    flex-shrink: 0;
    box-shadow: 0 4px 8px rgba(192, 0, 0, 0.3);
  }
  .header-text h1 {
    margin: 0; font-size: 1.4rem;
    letter-spacing: -0.5px; text-transform: uppercase;
  }
  .header-text p {
    margin: 4px 0 0; font-size: 0.8rem;
    font-weight: 600; color: var(--brand-red);
    letter-spacing: 0.5px; text-transform: uppercase;
  }

  .card{
    background:var(--card); border-radius:16px;
    padding:28px; box-shadow:0 10px 30px rgba(0,0,0,0.06);
  }
  label{
    display:block; font-size:.8rem; font-weight:700;
    color:var(--text-muted); text-transform:uppercase;
    letter-spacing:.6px; margin-bottom:10px;
  }
  .search-row{display:flex;gap:12px;flex-wrap:wrap;}
  input[type="text"]{
    flex:1 1 220px; padding:15px 18px;
    font-size:1.15rem; letter-spacing:1px;
    border:2px solid var(--line); border-radius:10px;
    outline:none; transition:.18s;
    font-family:'Courier New',monospace; min-width:0;
    background:#FAFAFA;
  }
  input[type="text"]:focus{
    border-color:var(--brand-red);
    box-shadow:0 0 0 4px rgba(192,0,0,0.12);
    background:#FFF;
  }
  button{
    padding:15px 28px; font-size:1rem; font-weight:700;
    border:0; border-radius:10px;
    background:var(--brand-red); color:#fff;
    cursor:pointer; transition:.18s;
    text-transform:uppercase; letter-spacing:.5px;
  }
  button:hover{background:var(--brand-dark);}
  button:active{transform:translateY(1px);}
  button.ghost{background:#F1F5F9;color:#334155;text-transform:none;}
  button.ghost:hover{background:#E2E8F0;}
  .hint{margin-top:12px;font-size:.78rem;color:var(--text-muted);}

  #result{margin-top:28px;}
  .empty-state{
    text-align:center;padding:40px 12px;color:var(--text-muted);font-size:.95rem;
  }
  .empty-state .ico{font-size:2.8rem;display:block;margin-bottom:12px;opacity:.4;}

  .alert{
    border-radius:12px;padding:18px 20px;font-size:.95rem;font-weight:600;
    display:flex;gap:12px;align-items:flex-start;
  }
  .alert.err{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA;}

  /* ---------- PERSON (nome + CPF) ---------- */
  .person{
    display:flex;align-items:center;gap:16px;
    padding-bottom:20px;border-bottom:2px dashed var(--line);margin-bottom:20px;
  }
  .avatar{
    width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,var(--brand-red),#E53935);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:1.25rem;flex:0 0 56px;
    box-shadow:0 4px 8px rgba(192,0,0,0.2);
  }
  .person-info{flex:1;min-width:0;}
  .person-info h2{margin:0;font-size:1.25rem;line-height:1.3;}
  .person-info span{
    font-size:.85rem;color:var(--text-muted);
    font-family:'Courier New',monospace;
    display:block;margin-top:4px;
  }

  /* ---------- GRID ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:560px){.grid{grid-template-columns:1fr;}}

  .field{
    background:#F8FAFC;border:1px solid var(--line);
    border-radius:12px;padding:15px 16px;
  }
  .field.full{grid-column:1/-1;}
  .field .k{
    font-size:.7rem;font-weight:700;letter-spacing:.8px;
    text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;
  }
  .field .v{
    font-size:1.05rem;font-weight:600;line-height:1.4;
    word-break:break-word;
  }

  /* Valor com logo ao lado (usado no campo BANCO) */
  .value-with-logo{
    display:flex;align-items:center;gap:10px;
  }
  .bank-logo-wrap{
    width:32px;height:32px;flex:0 0 32px;
    border-radius:8px;
    background:#fff;
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .bank-logo{
    width:100%;height:100%;
    object-fit:contain;
    padding:2px;
    display:block;
  }
  .bank-logo.hidden{display:none;}
  .bank-fallback{
    width:100%;height:100%;
    display:none;
    align-items:center;justify-content:center;
    color:#fff;
    font-weight:900;
    font-size:1rem;
    font-family:Arial, sans-serif;
  }
  .bank-fallback.show{display:flex;}

  /* Destaque para o número da proposta */
  .field .v .prop-num{
    color:var(--brand-red);
    font-weight:800;
    font-family:'Courier New',monospace;
    letter-spacing:.3px;
  }

  /* ---------- STEPPER ---------- */
  .stepper-box{
    margin-top:20px;
    background:#FAFAFA;
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 18px 18px;
  }
  .stepper-title{
    font-size:.72rem;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .stepper-title::before{
    content:"📊";
    font-size:1rem;
  }
  .stepper-title .progress-info{
    margin-left:auto;
    font-size:.7rem;
    color:var(--brand-red);
    font-weight:800;
    background:#FFF5F5;
    padding:3px 10px;
    border-radius:999px;
    letter-spacing:.5px;
  }
  .stepper-title .progress-info.refused{
    color:#fff;
    background:var(--step-refused);
  }

  .stepper{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:0;
    position:relative;
  }
  .step{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    position:relative;
    min-width:0;
  }

  .step:not(:last-child)::after{
    content:"";
    position:absolute;
    top:16px;
    left:calc(50% + 18px);
    right:calc(-50% + 18px);
    height:3px;
    background:var(--step-pending);
    z-index:0;
    transition:.3s;
  }
  .step.done:not(:last-child)::after{background:var(--step-done);}
  .step.current:not(:last-child)::after{
    background:linear-gradient(to right, var(--step-done) 0%, var(--step-done) 50%, var(--step-pending) 50%, var(--step-pending) 100%);
  }

  .step-dot{
    width:34px;height:34px;border-radius:50%;
    background:#FFF;
    border:3px solid var(--step-pending);
    display:flex;align-items:center;justify-content:center;
    font-size:.75rem;font-weight:800;
    color:var(--step-pending);
    z-index:1;position:relative;
    transition:.25s;
    flex-shrink:0;
  }
  .step-label{
    margin-top:8px;
    font-size:.6rem;
    font-weight:700;
    letter-spacing:.3px;
    text-transform:uppercase;
    color:var(--step-pending);
    line-height:1.25;
    transition:.25s;
    padding:0 2px;
    word-break:break-word;
  }

  .step.done .step-dot{
    background:var(--step-done);
    border-color:var(--step-done);
    color:#FFF;
  }
  .step.done .step-label{color:var(--brand-dark);}

  .step.current .step-dot{
    background:#FFF;
    border-color:var(--step-current);
    color:var(--step-current);
    transform:scale(1.15);
    box-shadow:0 0 0 6px rgba(192,0,0,0.15);
    animation:pulse 2s infinite;
  }
  .step.current .step-label{
    color:var(--brand-red);
    font-weight:800;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 6px rgba(192,0,0,0.15);}
    50%{box-shadow:0 0 0 11px rgba(192,0,0,0.06);}
  }

  .step.refused .step-dot{
    background:var(--step-refused);
    border-color:var(--step-refused);
    color:#FFF;
    transform:scale(1.15);
    box-shadow:0 0 0 6px rgba(220,38,38,0.18);
    animation:none;
  }
  .step.refused .step-label{
    color:var(--step-refused);
    font-weight:800;
  }

  @media(max-width:640px){
    .stepper{

      gap:0;
      padding-left:6px;

    .step{

      align-items:center;
      text-align:left;
      gap:14px;
      padding:8px 0;
      width:100%;
    }

      top:calc(50% + 17px);
      left:16px;
      right:auto;
      width:3px;
      height:calc(100% - 34px);
    }
    .step-label{

    text-transform:uppercase;color:var(--cost-text);

  .custo-doc .obs{
    margin-top:10px;
    font-size:.72rem;
    color:var(--cost-text);
    opacity:.85;
    line-height:1.4;
  }

  .creditos{
    margin-top:16px;border-radius:14px;padding:18px 20px;
    background:#FFF5F5;border:1px solid #FECACA;

    margin:0 0 14px;font-size:.75rem;letter-spacing:1px;

  .creditos h3::before{content:"💰";font-size:1.1rem;}
  .creditos-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:560px){.creditos-row{grid-template-columns:1fr;}}

  .credito{
    background:#FFFFFF;border:1px solid #FECACA;
    border-radius:10px;padding:14px 16px;

  .credito .k{
    font-size:.68rem;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;color:var(--brand-dark);

  .credito .v{
    font-size:1.35rem;font-weight:800;color:var(--brand-red);

  .credito .v.zero{color:#94A3B8;font-weight:700;font-size:1.15rem;}

  .actions{margin-top:24px;display:flex;gap:12px;justify-content:flex-end;}

  footer{
    text-align:center;margin-top:32px;padding:16px;
    background:var(--brand-red);color:#fff;border-radius:12px;
    font-size:.8rem;font-weight:600;letter-spacing:.5px;
    box-shadow:0 4px 10px rgba(192,0,0,0.2);
  }
</style>
</head>

    banco: "Bradesco", proposta: "",
    finan_prop: 290000, finan_comp: 19750.00, servicos_doc: 27097.00 }
];

/* =========================================================
   3) MAPA DOS BANCOS (domínio + cor para fallback)
   ========================================================= */
const BANCOS_DOMINIOS = {
  "Inter":      { dominio: "bancointer.com.br", cor: "#FF7A00", inicial: "I" },
  "Itaú":       { dominio: "itau.com.br",       cor: "#EC7000", inicial: "I" },
  "Bradesco":   { dominio: "bradesco.com.br",   cor: "#CC092F", inicial: "B" },
  "Caixa":      { dominio: "caixa.gov.br",      cor: "#0067A5", inicial: "C" },
  "Santander":  { dominio: "santander.com.br",  cor: "#EC0000", inicial: "S" },
  "Em definição":{ dominio: "",                 cor: "#64748B", inicial: "?" }
};

/* =========================================================
   4) UTILITÁRIOS
   ========================================================= */
const soDigitos = (v) => String(v || "").replace(/\D/g, "");

function mascaraCPF(valor) {
  const d = soDigitos(valor).slice(0, 11);
  return d
    .replace(/^(\d{3})(\d)/, "$1.$2")
    .replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3")
    .replace(/^(\d{3})\.(\d{3})\.(\d{3})(\d)/, "$1.$2.$3-$4");
}

function dataBR(iso) {
  if (!iso) return "—";
  if (/^\d{4}-\d{2}-\d{2}/.test(iso)) {
    const [a, m, d] = String(iso).slice(0, 10).split("-");
    return `${d}/${m}/${a}`;
  }
  return iso;
}

function moedaBR(v) {
  const n = Number(v);
  if (!isFinite(n)) return "—";
  return n.toLocaleString("pt-BR", {
    style: "currency", currency: "BRL",
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });
}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function classeStatus(status) {
  const s = String(status).toUpperCase();
  if (s.includes("RECUS")) return "b-recusado";
  if (s.includes("FINALIZ") || s.includes("CONCLU")) return "b-finalizado";
  if (s.includes("DOCUMENTO")) return "b-documentos";
  if (s.includes("PRE") || s.includes("PRÉ")) return "b-pre";
  if (s.includes("JURIDIC")) return "b-juridica";
  if (s.includes("REGISTRO")) return "b-registro";
  if (s.includes("ASSINATURA")) return "b-assinatura";
  if (s.includes("VISTORIA")) return "b-vistoria";
  return "";
}

function iniciais(nome) {
  const p = String(nome).trim().split(/\s+/);
  return ((p[0]?.[0] || "") + (p[1]?.[0] || "")).toUpperCase() || "?";
}

function resolverFluxo(status) {
  const s = String(status || "").toUpperCase().trim();

  if (s.includes("RECUS")) {
    return { fluxo: FLUXO_RECUSADO, idx: 0, recusado: true };
  }

  let idx = -1;

  if (s.includes("FINALIZ") || s.includes("CONCLU")) {
    idx = FLUXO_APROVADO.indexOf("FINALIZADO");
  } else if (s.includes("POS-VENDA") || s.includes("PÓS-VENDA")) {
    idx = FLUXO_APROVADO.indexOf("POS-VENDA");
  } else if (s.includes("REGISTRO")) {
    idx = FLUXO_APROVADO.indexOf("EM REGISTRO");
  } else if (s.includes("ASSINATURA")) {
    idx = FLUXO_APROVADO.indexOf("ASSINATURA");
  } else if (s.includes("JURIDIC")) {
    idx = FLUXO_APROVADO.indexOf("ANALISE JURIDICA");
  } else if (s.includes("VISTORIA")) {
    idx = FLUXO_APROVADO.indexOf("VISTORIA");
  } else if (s.includes("DOCUMENTO")) {
    idx = FLUXO_APROVADO.indexOf("DOCUMENTOS");
  } else if (s.includes("PRE") || s.includes("PRÉ")) {
    idx = 0;
  }

  if (idx < 0) idx = 0;

  return { fluxo: FLUXO_APROVADO, idx, recusado: false };
}

/* =========================================================
   5) STEPPER
   ========================================================= */
function renderStepper(statusAtual) {
  const { fluxo, idx, recusado } = resolverFluxo(statusAtual);
  const total = fluxo.length;

  const steps = fluxo.map((etapa, i) => {
    let cls = "step";
    let conteudo = i + 1;
    let label = etapa;

    if (recusado) {
      cls += " refused";
      conteudo = "✕";
      label = "PRÉ-ANÁLISE RECUSADO";
    } else {
      if (i < idx) { cls += " done"; conteudo = "✓"; }
      else if (i === idx) { cls += " current"; conteudo = i + 1; }

      if (etapa === "PRÉ-ANALISE APROVADO") label = "PRÉ-ANÁLISE APROVADO";
      else if (etapa === "ANALISE JURIDICA") label = "ANÁLISE JURÍDICA";
      else if (etapa === "POS-VENDA") label = "PÓS-VENDA";
    }

    return `
      <div class="${cls}">
        <div class="step-dot">${conteudo}</div>
        <div class="step-label">${esc(label)}</div>
      </div>`;
  }).join("");

  let progresso;
  if (recusado) {
    progresso = `<span class="progress-info refused">PRÉ-ANÁLISE RECUSADA</span>`;
  } else {
    const concluidas = idx;
    progresso = `<span class="progress-info">${concluidas}/${total - 1} etapas</span>`;
  }

  return `
    <div class="stepper-box">
      <div class="stepper-title">
        Progresso do processo
        ${progresso}
      </div>
      <div class="stepper">${steps}</div>
    </div>`;
}

/* =========================================================
   6) BUSCA
   ========================================================= */
function buscarCPF(cpfDigitado) {
  const alvo = soDigitos(cpfDigitado);
  if (!alvo) return { erro: "Informe um CPF para consultar." };
  if (alvo.length !== 11) return { erro: "CPF incompleto. Digite os 11 números." };

  const achado = CLIENTES.find(c => soDigitos(c.cpf) === alvo);
  if (!achado) return { erro: "CPF não encontrado na base de processos. Verifique o número digitado ou fale com o responsável." };

  return { cliente: achado };
}

/* =========================================================
   7) RENDERIZAÇÃO
   ========================================================= */
const elResult = document.getElementById("result");
const elCpf    = document.getElementById("cpf");

let imgUid = 0;

function renderErro(msg) {
  elResult.innerHTML = `
    <div class="alert err">
      <span>⚠️</span>
      <span>${esc(msg)}</span>
    </div>`;
}

function renderCliente(c) {
  const propZero  = !c.finan_prop   || Number(c.finan_prop) === 0;
  const compZero  = !c.finan_comp   || Number(c.finan_comp) === 0;
  const docZero   = !c.servicos_doc || Number(c.servicos_doc) === 0;

  const bancoConfig = BANCOS_DOMINIOS[c.banco] || BANCOS_DOMINIOS["Em definição"];
  const temDominio  = !!bancoConfig.dominio;
  const temProposta = c.proposta && String(c.proposta).trim() !== "";

  const uid = ++imgUid;
  const idImg      = `bankLogo${uid}`;
  const idFallback = `bankFallback${uid}`;

  const srcClearbit = temDominio ? `https://logo.clearbit.com/${bancoConfig.dominio}` : "";
  const srcGoogle   = temDominio ? `https://www.google.com/s2/favicons?domain=${bancoConfig.dominio}&sz=128` : "";

  elResult.innerHTML = `
    <div class="person">
      <div class="avatar">${esc(iniciais(c.nome))}</div>
      <div class="person-info">
        <h2>${esc(c.nome)}</h2>
        <span>CPF ${esc(c.cpf)}</span>
      </div>
    </div>

    <div class="grid">

      <!-- BANCO (com logo ao lado) -->
      <div class="field">
        <div class="k">Banco</div>
        <div class="v value-with-logo">
          <div class="bank-logo-wrap">
            <img id="${idImg}"
                 class="bank-logo"
                 src="${srcClearbit}"
                 alt="Logo ${esc(c.banco)}"
                 crossorigin="anonymous"
                 referrerpolicy="no-referrer"
                 onerror="
                   if(!this.dataset.tentouGoogle && this.dataset.srcGoogle){
                     this.dataset.tentouGoogle='1';
                     this.src=this.dataset.srcGoogle;
                   } else {
                     this.classList.add('hidden');
                     var fb=document.getElementById('${idFallback}');
                     if(fb) fb.classList.add('show');
                   }
                 "
                 data-src-google="${srcGoogle}">
            <div id="${idFallback}"
                 class="bank-fallback"
                 style="background:${bancoConfig.cor};">
              ${esc(bancoConfig.inicial)}
            </div>
          </div>
          <span>${esc(c.banco)}</span>
        </div>
      </div>

      <!-- Nº DA PROPOSTA -->
      <div class="field">
        <div class="k">Nº da proposta</div>
        <div class="v">
          ${temProposta
            ? `<span class="prop-num">${esc(c.proposta)}</span>`
            : `<span style="color:#94A3B8;font-weight:600;">Em definição</span>`}
        </div>
      </div>

      <div class="field">
        <div class="k">Data de envio para aprovação</div>
        <div class="v">${esc(dataBR(c.inicio))}</div>
      </div>

      <div class="field">
        <div class="k">Status atual</div>
        <div class="v">
          <span class="badge ${classeStatus(c.status)}">${esc(c.status)}</span>
        </div>
      </div>

      <div class="field full">
        <div class="k">Corretor responsável</div>
        <div class="v">${esc(c.corretor)}</div>
      </div>

      <div class="field full pendencia">
        <div class="k">Tipo de pendência</div>
        <div class="v">${esc(c.pendencia)}</div>
      </div>

      <div class="field full prox-fup">
        <div class="k">📅 Próximo Follow-up</div>
        <div class="v">${esc(dataBR(c.prox_fup))}</div>
      </div>

      <div class="field full previsao">
        <div class="k">📋 Previsão de Término de Registro</div>
        <div class="v">${esc(dataBR(c.prev_conclusao))}</div>
      </div>
    </div>

    ${renderStepper(c.status)}

    <div class="custo-doc">
      <h3>Custo estimado da documentação</h3>
      <div class="custo-doc-row">
        <div class="custo-item">
          <div class="k">Serviços / Documentação</div>
          <div class="v ${docZero ? "zero" : ""}">${esc(moedaBR(c.servicos_doc))}</div>
        </div>
        <div class="custo-item">
          <div class="k">Situação</div>
          <div class="v" style="font-size:1rem;color:${docZero ? '#94A3B8' : '#B45309'};">
            ${docZero ? 'Aguardando definição' : 'Valor estimado para o processo'}
          </div>
        </div>
      </div>
      <div class="obs">
        💡 Valor estimado com base no custo de serviços e documentação do seu processo.
        O valor final pode sofrer pequenas variações conforme as etapas avançam.
      </div>
    </div>

    <div class="creditos">
      <h3>Créditos aprovados</h3>
      <div class="creditos-row">
        <div class="credito">
          <div class="k">Crédito aprovado a ser pago ao proprietário</div>
          <div class="v ${propZero ? "zero" : ""}">${esc(moedaBR(c.finan_prop))}</div>
        </div>
        <div class="credito">
          <div class="k">Crédito aprovado para reembolso da documentação</div>
          <div class="v ${compZero ? "zero" : ""}">${esc(moedaBR(c.finan_comp))}</div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="ghost" id="btnNova">Nova consulta</button>
    </div>
  `;

  if (!temDominio) {
    const img = document.getElementById(idImg);
    const fb  = document.getElementById(idFallback);
    if (img) img.classList.add("hidden");
    if (fb)  fb.classList.add("show");
  }

  document.getElementById("btnNova").addEventListener("click", () => {
    elCpf.value = "";
    elCpf.focus();
    elResult.innerHTML = `<div class="empty-state"><span class="ico">🔎</span>Aguardando consulta...</div>`;
  });
}

function executarBusca() {
  const r = buscarCPF(elCpf.value);
  if (r.erro) { renderErro(r.erro); return; }
  renderCliente(r.cliente);
}

/* =========================================================
   8) EVENTOS
   ========================================================= */
elCpf.addEventListener("input", (e) => { e.target.value = mascaraCPF(e.target.value); });

elCpf.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); executarBusca(); }
});

document.getElementById("btnBuscar").addEventListener("click", executarBusca);

elCpf.focus();
</script>
</body>
</html>
